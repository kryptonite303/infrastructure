argo-cd:
  global:
    domain: argocd.k8s.johnchen.dev
  dex:
    servicePortHttpName: tcp
    livenessProbe:
      enabled: true
      httpPath: /healthz/live
      httpPort: metrics
      httpScheme: HTTP
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 3
    readinessProbe:
      enabled: true
      httpPath: /healthz/ready
      httpPort: metrics
      httpScheme: HTTP
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 3
  configs:
    params:
      server.insecure: true
    cm:
      dex.config: |
        connectors:
          - type: oidc
            id: pocketid
            name: Pocket ID
            config:
              issuer: https://pocket-id.k8s.johnchen.dev
              clientID: $dex.pocketid.clientID
              clientSecret: $dex.pocketid.clientSecret
              redirectURI: https://argocd.k8s.johnchen.dev/api/dex/callback
              insecureEnableGroups: true
              scopes:
                - profile
                - email
                - groups
    rbac:
      policy.default: 'role:readonly'
      policy.csv: |
        g, argocd_admins, role: admin
      scopes: '[groups, email]'
