app-template:
  controllers:
    main:
      type: deployment
      replicas: 1
      containers:
        main:
          image:
            repository: ghcr.io/thephaseless/byparr
            tag: 2.1.0
  service:
    main:
      controller: main
      ports:
        http:
          port: 8191
  persistence:
    config:
      enabled: true
      storageClass: nfs
      size: 1Gi
      globalMounts:
        - path: /config
      accessMode: ReadWriteOnce
  ingress:
    main:
      enabled: true
      className: traefik
      hosts:
        - host: byparr.k8s.johnchen.dev
          paths:
            - path: /
              pathType: Prefix
              service:
                name: byparr
                port: 8191
      tls:
        - secretName: wildcard-tls-secret
          hosts:
            - byparr.k8s.johnchen.dev
