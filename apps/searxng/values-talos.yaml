app-template:
  controllers:
    main:
      type: deployment
      replicas: 1
      containers:
        main:
          image:
            repository: searxng/searxng
            tag: "2026.10.7-6671d89be"
          env:
            TZ: America/New_York
            SEARXNG_BASE_URL: https://searxng.k8s.johnchen.dev
          probes:
            liveness:
              enabled: true
              path: /healthz
              port: 8080
              type: HTTP
              spec:
                initialDelaySeconds: 15
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 3
            readiness:
              enabled: true
              path: /healthz
              port: 8080
              type: HTTP
              spec:
                initialDelaySeconds: 5
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 6
  service:
    main:
      controller: main
      ports:
        http:
          port: 8080
  persistence:
    config:
      enabled: true
      storageClass: nfs
      size: 1Gi
      globalMounts:
        - path: /etc/searxng
      accessMode: ReadWriteOnce
  ingress:
    main:
      enabled: true
      className: traefik
      hosts:
        - host: searxng.k8s.johnchen.dev
          paths:
            - path: /
              pathType: Prefix
              service:
                name: searxng
                port: 8080
      tls:
        - secretName: wildcard-tls-secret
          hosts:
            - searxng.k8s.johnchen.dev
